name: CI  (Rust only)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"

jobs:
  test:
    name: Test Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.82.0, stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Build
        run: cargo build --verbose --no-default-features

      - name: Run tests
        run: cargo test --verbose --no-default-features --lib

      - name: Run CLI tests
        run: |
          cargo build --bin kmerseek --no-default-features
          cargo test tests::test_cli --verbose --no-default-features

      - name: Test CLI binary
        run: |
          cargo run --bin kmerseek --no-default-features -- --help
          cargo run --bin kmerseek --no-default-features -- index --help

  release:
    name: Release Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Build release
        run: cargo build --release --verbose --no-default-features

  cli-integration:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Build release
        run: cargo build --release --no-default-features

      - name: Test CLI with real data
        run: |
          cargo run --bin kmerseek --no-default-features -- index \
            --input tests/testdata/fasta/ced9.fasta \
            --output test_output.db \
            --ksize 5 \
            --encoding protein

          cargo run --bin kmerseek --no-default-features -- index \
            --input tests/testdata/fasta/bcl2_first25_uniprotkb_accession_O43236_OR_accession_2025_02_06.fasta.gz \
            --output test_output_gz.db \
            --ksize 10 \
            --encoding hp

          cargo run --bin kmerseek --no-default-features -- index \
            --input tests/testdata/fasta/ced9.fasta \
            --output test_output_dayhoff.db \
            --ksize 8 \
            --encoding dayhoff

          ls -la test_output*.db

      - name: Cleanup
        if: always()
        run: rm -rf test_output*.db

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Run benchmarks
        run: cargo bench --verbose --no-default-features -- --output-format json > benchmark_results.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "cargo"
          output-file-path: benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-on-alert: true
          alert-threshold: "150%"
          fail-on-alert: false
          benchmark-data-dir-path: "dev/bench"
