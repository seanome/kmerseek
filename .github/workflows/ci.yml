name: CI  (Rust only)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"

jobs:
  test:
    name: Test Rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.82.0, stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Build
        run: cargo build --verbose --no-default-features

      - name: Run tests
        # --bins: the tests inside main.rs live in the kmerseek binary, not the library.
        run: cargo test --verbose --no-default-features --lib --bins

      - name: Run CLI tests
        run: |
          cargo build --bin kmerseek --no-default-features
          cargo test tests::test_cli --verbose --no-default-features

      - name: Test CLI binary
        run: |
          cargo run --bin kmerseek --no-default-features -- --help
          cargo run --bin kmerseek --no-default-features -- index --help

  python-scripts:
    name: Test Python scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest matplotlib polars

      - name: Run tests
        run: python -m pytest scripts/ -v

  release:
    name: Release Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Build release
        run: cargo build --release --verbose --no-default-features

  cli-integration:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Build release
        run: cargo build --release --no-default-features

      - name: Test CLI with real data
        run: |
          cargo run --bin kmerseek --no-default-features -- index \
            --input tests/testdata/fasta/ced9.fasta \
            --output test_output.db \
            --ksize 5 \
            --alphabet protein20

          cargo run --bin kmerseek --no-default-features -- index \
            --input tests/testdata/fasta/bcl2_first25_uniprotkb_accession_O43236_OR_accession_2025_02_06.fasta.gz \
            --output test_output_gz.db \
            --ksize 10 \
            --alphabet hp_lehninger2

          cargo run --bin kmerseek --no-default-features -- index \
            --input tests/testdata/fasta/ced9.fasta \
            --output test_output_dayhoff.db \
            --ksize 8 \
            --alphabet dayhoff6

          ls -la test_output*.db

      - name: Cleanup
        if: always()
        run: rm -rf test_output*.db

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 45
    # The job's token is read-only by default; a commit comment on an alert needs write.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Restore earlier benchmark results
        uses: actions/cache@v4
        with:
          path: ./benchmark-history
          key: benchmark-history-${{ github.run_id }}
          restore-keys: benchmark-history-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Run benchmarks
        # Only the Criterion bench in benches/benchmark.rs: `cargo bench` with no target also
        # runs the library's test harness, which rejects Criterion's options. `bencher` is
        # the output format the "cargo" tool of github-action-benchmark reads. Criterion's
        # default of 100 samples per benchmark takes over an hour here.
        run: |
          cargo bench --verbose --no-default-features --bench benchmark \
            -- --output-format bencher --sample-size 10 --warm-up-time 1 --measurement-time 2 \
            > benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "cargo"
          output-file-path: benchmark_results.txt
          # Kept in the Actions cache: the repo has no gh-pages branch to push to, because
          # GitHub Pages deploys from a workflow.
          external-data-json-path: ./benchmark-history/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          alert-threshold: "150%"
          fail-on-alert: false
