name: "Build and Test (Python + Rust)"
on:
  pull_request:
  push:
    branches: [latest]
jobs:
  tests_on_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: cache conda
        uses: actions/cache@v4
        env:
          CACHE_NUMBER: 1
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}

      - name: cache rust
        uses: Swatinem/rust-cache@v2
        with:
          key: 1.82.0

      - name: setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.12
          channels: conda-forge,bioconda
          miniforge-version: latest
          use-mamba: true
          mamba-version: "*"
          activate-environment: kmerseek-dev
          auto-activate-base: false

      - run: conda info
      - run: conda list
      - run: conda config --show

      - run: mamba search rust

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential binutils
          # Show available resources
          df -h
          free -h

      - name: install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0

      - name: setup environment for rust builds
        run: |
          # Set TMPDIR to workspace to avoid /tmp filling up
          export TMPDIR=$HOME/tmp
          mkdir -p $TMPDIR
          echo "TMPDIR=$TMPDIR" >> $GITHUB_ENV
          # Ensure we use system compiler and OpenSSL instead of conda ones
          export CC=gcc
          export CXX=g++
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export OPENSSL_DIR=/usr
          export OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu
          export OPENSSL_INCLUDE_DIR=/usr/include
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV

      - name: install python dependencies
        shell: bash -l {0}
        run: mamba install compilers polars sourmash sourmash_plugin_branchwater click pytest pandas

      - name: build
        run: make

      - name: clean before build
        run: |
          # Clean to avoid linker issues with stale artifacts
          cargo clean
          # Clean up /tmp before starting
          find /tmp -name "rustc*" -type f -delete 2>/dev/null || true
          find /tmp -name "cc*" -type f -delete 2>/dev/null || true
          find /tmp -name "*.s" -type f -delete 2>/dev/null || true
          find /tmp -name "*.o" -type f -delete 2>/dev/null || true
          df -h

      - name: Check disk space
        run: |
          df -h
          du -sh ~/.cargo ~/.rustup target /tmp 2>/dev/null || true

      - name: Clean temp files
        run: |
          # Clean up /tmp aggressively before build
          find /tmp -name "rustc*" -type f -delete 2>/dev/null || true
          find /tmp -name "cc*" -type f -delete 2>/dev/null || true
          find /tmp -name "*.s" -type f -delete 2>/dev/null || true
          find /tmp -name "*.o" -type f -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -delete 2>/dev/null || true
          df -h

      - name: build binary for tests
        run: |
          # Use system linker (bfd) instead of rust-lld to avoid crashes
          # Limit parallelism to reduce memory pressure and disk usage
          # Set TMPDIR to avoid /tmp filling up
          export TMPDIR=$HOME/tmp
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          CARGO_BUILD_JOBS=1 cargo build --bin kmerseek-rust --all-features
          # Clean up incremental artifacts immediately
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          df -h
          ls -la target/debug/
          ls -la target/debug/kmerseek-rust || echo "Binary not found in target/debug/"

      - name: cargo test
        run: |
          # Use system linker and limit parallelism to reduce memory pressure
          # Set TMPDIR to avoid /tmp filling up
          export TMPDIR=$HOME/tmp
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          CARGO_BUILD_JOBS=1 cargo test --all-features --workspace
          # Clean up after tests
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          find /tmp -name "rustc*" -type f -delete 2>/dev/null || true
          df -h

      - name: test rust cli
        run: |
          cargo run --bin kmerseek-rust -- --help
          cargo run --bin kmerseek-rust -- index --help
          # Test basic indexing
          cargo run --bin kmerseek-rust -- index \
            --input tests/testdata/fasta/ced9.fasta \
            --output test_output.db \
            --ksize 5 \
            --encoding protein
          ls -la test_output.db
          rm -rf test_output.db

      - name: pytest
        shell: bash -l {0}
        run: pytest -vv

      - name: Cleanup after tests
        if: always()
        run: |
          # Clean up build artifacts to free space
          find target -name "*.o" -delete 2>/dev/null || true
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -delete 2>/dev/null || true
          find /tmp -name "rustc*" -type f -delete 2>/dev/null || true
          find /tmp -name "cc*" -type f -delete 2>/dev/null || true
          find /tmp -name "*.s" -type f -delete 2>/dev/null || true
          df -h
