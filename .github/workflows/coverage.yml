name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: stable

      - name: Cache cargo-tarpaulin
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ hashFiles('Cargo.lock') }}

      - name: Setup TMPDIR
        run: |
          export TMPDIR=$HOME/tmp
          mkdir -p $TMPDIR
          echo "TMPDIR=$TMPDIR" >> $GITHUB_ENV

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential binutils python3-dev
          df -h
          free -h

      - name: Build binary for tests
        run: |
          export TMPDIR=$HOME/tmp
          PYTHON_VERSION=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd -C link-arg=-lpython${PYTHON_VERSION}"
          CARGO_BUILD_JOBS=1 cargo build --bin kmerseek --no-default-features
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          df -h
          ls -la target/debug/kmerseek || echo "Binary not found in target/debug/"

      - name: Run Rust tests
        run: |
          export TMPDIR=$HOME/tmp
          PYTHON_VERSION=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd -C link-arg=-lpython${PYTHON_VERSION}"
          CARGO_BUILD_JOBS=1 cargo test --verbose --no-default-features
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          find /tmp -name "rustc*" -type f -delete 2>/dev/null || true
          df -h

      - name: Generate Rust coverage report
        run: |
          export TMPDIR=$HOME/tmp
          PYTHON_VERSION=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd -C link-arg=-lpython${PYTHON_VERSION}"
          cargo install cargo-tarpaulin
          CARGO_BUILD_JOBS=1 cargo tarpaulin --out Xml --output-dir coverage/ --timeout 120 --skip-clean --no-default-features
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          find /tmp -name "rustc*" -type f -delete 2>/dev/null || true
          df -h

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/cobertura.xml
          flags: rust
          name: codecov-rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
