name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TARPAULIN_VERSION: "0.31.2"

jobs:
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ env.TARPAULIN_VERSION }}

      - name: Setup TMPDIR
        run: |
          mkdir -p $HOME/tmp
          echo "TMPDIR=$HOME/tmp" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential binutils python3-dev
          PYTHON_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          echo "LD_LIBRARY_PATH=${PYTHON_LIB_DIR}:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          df -h
          free -h

      - name: Install cargo-tarpaulin (prebuilt)
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C ~/.cargo/bin

      - name: Run tests (fast fail before coverage)
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          CARGO_BUILD_JOBS=1 cargo test --no-default-features

      - name: Build binary (required for CLI tests via assert_cmd)
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          CARGO_BUILD_JOBS=1 cargo build --bins --no-default-features

      - name: Generate Rust coverage report
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          CARGO_BUILD_JOBS=1 cargo tarpaulin \
            --out Xml --output-dir coverage/ \
            --timeout 120 --skip-clean --no-default-features
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          df -h

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/cobertura.xml
          flags: rust
          name: codecov-rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
