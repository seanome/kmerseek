name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TARPAULIN_VERSION: "0.31.2"

jobs:
  coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: cargo-tarpaulin-${{ env.TARPAULIN_VERSION }}

      - name: Setup TMPDIR
        run: |
          mkdir -p $HOME/tmp
          echo "TMPDIR=$HOME/tmp" >> $GITHUB_ENV

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential binutils python3-dev
          df -h
          free -h

      - name: Install cargo-tarpaulin (prebuilt)
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C ~/.cargo/bin

      - name: Build binary for CLI tests
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          # WHY: was CARGO_BUILD_JOBS=1 to avoid OOM on the runner; now that
          # cargo-tarpaulin is no longer a dev-dependency (it doubled the dependency
          # tree for no reason - the CLI binary is downloaded separately, above),
          # there's less peak memory pressure, so try a small amount of parallelism.
          # Revert to 1 if this OOMs again.
          CARGO_BUILD_JOBS=2 cargo build --bins --no-default-features
          echo "CARGO_BIN_EXE_kmerseek=$(pwd)/target/debug/kmerseek" >> $GITHUB_ENV

      - name: Generate Rust coverage report
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=bfd"
          # --no-dead-code: pyo3 (via sourmash_plugin_branchwater) is pulled in with the
          # extension-module feature, so its build script does not emit the libpython link
          # flags. A normal `cargo build` links fine because --gc-sections drops the unused
          # pyo3 FFI code, but tarpaulin defaults to -C link-dead-code which keeps it,
          # leaving PyGen_Type/PyCapsule_Import unresolved. --no-dead-code turns that off
          # so the coverage build links like a normal build.
          CARGO_BUILD_JOBS=2 cargo tarpaulin --no-dead-code \
            --out Xml --output-dir coverage/ \
            --timeout 120 --skip-clean --no-default-features
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          df -h
          find target/debug/incremental -type f -name "*.o" -delete 2>/dev/null || true
          find $TMPDIR -name "rustc*" -type f -mmin +1 -delete 2>/dev/null || true
          df -h

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/cobertura.xml
          flags: rust
          name: codecov-rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
